name: yandex-parser

# The application reads the bind-mounted .env; the variables below only override
# what differs inside the compose network (service host names).
x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  image: yandex-parser-app:dev
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
  volumes:
    - ./:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app

  # Collection runs only in the queue, on its own queue name so a slow platform blocks nothing else.
  worker:
    <<: *app
    command: php artisan queue:work --queue=scraping --tries=5 --timeout=900

  scheduler:
    <<: *app
    command: php artisan schedule:work

  # Websocket server pushing collection progress to the browser (ADR-008).
  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_SERVER_PORT:-8080}:8080"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  node:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_HMR_HOST: localhost
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/app
      # Linux-native binaries must not be shared with the host's node_modules.
      - /app/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-yandex_parser}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
